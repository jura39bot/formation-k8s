<script>
const DATA = {"domains":[{"id":"m1","n":"Du conteneur au cluster","pct":"Module","e":"🧱","lessons":[{"id":"m1_l1","t":"Pourquoi Kubernetes","steps":[{"h":"Le conteneur seul ne suffit pas","p":"Une image Docker lancée à la main ne redémarre pas toute seule, ne se répartit pas sur plusieurs machines et ne survit pas à la panne d'un serveur. Kubernetes ajoute exactement ces trois choses : redémarrage, répartition, résilience."},{"h":"Ce que Kubernetes fait","p":"Il maintient un état désiré : vous décrivez ce que vous voulez (trois replicas de cette image), il compare en boucle avec l'état réel et corrige l'écart. C'est le principe de réconciliation, et c'est le cœur du système."},{"h":"Ce que Kubernetes ne fait pas","p":"Il ne construit pas vos images, ne gère pas vos secrets d'entreprise, ne remplace ni un CDN ni une base de données. Il orchestre des conteneurs, rien de plus. Beaucoup de projets souffrent d'avoir attendu autre chose."},{"h":"Quand ne pas l'utiliser","p":"Un site statique, un cron et une petite API ne justifient pas un cluster. Trois conteneurs sur une machine avec docker compose coûtent moins cher en temps, en argent et en compétences. Kubernetes se justifie à partir du moment où il y a plusieurs équipes, plusieurs environnements ou une exigence de disponibilité réelle."}]},{"id":"m1_l2","t":"L'architecture en une page","steps":[{"h":"Le control plane","p":"Quatre briques : l'API server, etcd, le scheduler et le controller-manager. L'API server est la porte d'entrée : tout passe par lui, en HTTPS. etcd stocke l'état complet du cluster. Le scheduler choisit le nœud. Le controller-manager exécute les boucles de réconciliation."},{"h":"Les nœuds","p":"Sur chaque machine de travail tournent le kubelet (qui parle à l'API server et pilote les conteneurs), le runtime de conteneurs (containerd le plus souvent) et kube-proxy (qui programme les règles réseau). Un nœud n'est rien d'autre qu'une machine avec ces trois composants."},{"h":"Le trajet d'une commande","p":"kubectl envoie une requête HTTPS à l'API server. Celui-ci authentifie, autorise (RBAC), valide (admission), puis écrit l'objet dans etcd. Le controller-manager voit la nouveauté, crée ce qui manque. Le scheduler assigne le pod. Le kubelet du nœud choisi crée le conteneur."},{"h":"Ce qui tombe si etcd tombe","p":"Tout. Le cluster perd la mémoire : l'API server ne peut plus lire ni écrire, les contrôleurs s'arrêtent, les applications continuent de tourner un moment puis s'arrêtent faute de pouvoir signaler leur état. La sauvegarde d'etcd n'est pas une option avancée, c'est la base."}]},{"id":"m1_l3","t":"Installer un cluster local","steps":[{"h":"Minikube","p":"Un nœud unique dans une machine virtuelle ou un conteneur. Commande : minikube start. C'est le plus simple pour apprendre, et suffisant pour 90 pour cent des exercices de cette formation."},{"h":"Kind","p":"Kind crée des clusters multi-nœuds dans des conteneurs Docker, en quelques secondes. Commande : kind create cluster --name demo. C'est le meilleur outil pour tester une topologie réaliste, un DaemonSet ou un problème réseau."},{"h":"Vérifier que ça tourne","p":"kubectl get nodes doit montrer un nœud Ready. kubectl get pods -A montre les composants système. Si un pod système est en CrashLoopBackOff dès l'installation, le problème est presque toujours la mémoire de la VM ou le runtime."},{"h":"Gérer les contextes","p":"kubectl config get-contexts liste les clusters connus, kubectl config use-context bascule de l'un à l'autre. Sur une machine qui a plusieurs clusters, la première cause d'erreur est de taper des commandes dans le mauvais contexte. Vérifiez toujours avant une opération destructrice."}]}]},{"id":"m2","n":"Les objets de base","pct":"Module","e":"📦","lessons":[{"id":"m2_l1","t":"Le Pod","steps":[{"h":"La plus petite unité","p":"Un pod contient un ou plusieurs conteneurs qui partagent le réseau et les volumes. Deux conteneurs dans un pod se parlent par localhost et partagent la même adresse IP. C'est le pattern sidecar : un conteneur applicatif, un conteneur auxiliaire."},{"h":"Le cycle de vie","p":"Un pod naît, tourne, meurt. Il n'est pas réparé : si le nœud tombe, un pod nu disparaît avec lui. C'est pour cela qu'on ne crée presque jamais de pod directement en production, mais un Deployment qui en fabrique."},{"h":"restartPolicy","p":"Always par défaut (relance le conteneur), OnFailure (relance seulement en cas d'erreur), Never. Un pod nu avec restartPolicy Always redémarre son conteneur, mais ne survit pas à la perte du nœud. La différence est essentielle."},{"h":"Créer et inspecter","p":"kubectl run demo --image=nginx crée un pod. kubectl get pod demo -o yaml montre l'objet complet. kubectl describe pod demo donne l'événementiel, c'est-à-dire pourquoi il ne démarre pas. Le YAML décrit l'intention, describe raconte l'histoire."}]},{"id":"m2_l2","t":"Deployment et ReplicaSet","steps":[{"h":"Le ReplicaSet","p":"Il garantit un nombre de pods identiques. Vous dites trois, il en maintient trois : il en crée si un meurt, il en supprime si vous baissez le compte. Il utilise un sélecteur de labels pour savoir quels pods sont les siens."},{"h":"Le Deployment","p":"Il gère des ReplicaSets successifs et donc les versions. Vous changez l'image, il crée un nouveau ReplicaSet, monte progressivement, et garde l'ancien pour un retour arrière. C'est l'objet standard pour une application sans état."},{"h":"Dérouler et vérifier","p":"kubectl create deployment web --image=nginx --replicas=3. kubectl rollout status deployment/web suit la progression. kubectl rollout history deployment/web liste les révisions. kubectl rollout undo deployment/web revient à la précédente."},{"h":"Le piège du sélecteur","p":"Un Deployment dont le sélecteur ne correspond à aucun label ne crée rien, sans erreur visible. Vérifiez que spec.selector.matchLabels correspond exactement à spec.template.metadata.labels. C'est l'erreur la plus fréquente chez les débutants."}]},{"id":"m2_l3","t":"Labels, annotations, namespaces","steps":[{"h":"Labels","p":"Des paires clé/valeur qui servent à sélectionner : kubectl get pods -l app=web. Tout le reste du système repose dessus : services, deployments, network policies. Un label mal orthographié casse une chaîne entière en silence."},{"h":"Annotations","p":"Même forme, autre usage : des métadonnées que Kubernetes ne sélectionne pas. Version de build, contact de l'équipe, configuration d'un ingress controller. Ne mettez jamais dans un label ce qui peut être long ou structuré."},{"h":"Namespaces","p":"Un cloisonnement logique des noms, pas une frontière de sécurité. Deux équipes dans deux namespaces ne voient pas les mêmes objets par défaut, mais peuvent se joindre en réseau. La sécurité vient du RBAC et des NetworkPolicies, pas du namespace."},{"h":"Les commandes utiles","p":"kubectl config set-context --current --namespace=dev évite de taper -n partout. kubectl get all -n dev montre l'essentiel. Attention : 'get all' ne montre pas tout, ni les secrets, ni les configmaps, ni les ingress selon les versions."}]}]},{"id":"m3","n":"Réseau","pct":"Module","e":"🌐","lessons":[{"id":"m3_l1","t":"Le Service","steps":[{"h":"À quoi il sert","p":"Un pod a une IP qui change à chaque recréation. Le Service donne une adresse stable et répartit le trafic sur les pods qui portent le bon label. C'est un répartiteur, pas un serveur."},{"h":"Les types","p":"ClusterIP : joignable seulement dans le cluster, le défaut. NodePort : ouvre un port sur chaque nœud, utile pour tester. LoadBalancer : demande une IP publique au fournisseur cloud. ExternalName : un alias DNS vers un service externe."},{"h":"port et targetPort","p":"port est le port du Service, targetPort le port du conteneur. Les confondre produit un service qui répond mais renvoie des erreurs de connexion. Vérifiez les deux, puis vérifiez les endpoints."},{"h":"Vérifier le câblage","p":"kubectl get endpoints mon-service doit lister des adresses. S'il est vide, le sélecteur ne correspond à aucun pod prêt. C'est la première chose à regarder quand un service ne répond pas."}]},{"id":"m3_l2","t":"Ingress","steps":[{"h":"Un contrôleur est obligatoire","p":"Un objet Ingress ne fait rien tout seul : il faut un ingress controller (NGINX, Traefik, HAProxy) qui lit les objets et configure un vrai proxy. Sur minikube : minikube addons enable ingress."},{"h":"Routage par hôte et par chemin","p":"Une règle associe un host et un path à un service. app.exemple.fr vers web:80, /api vers api:8080. L'ordre des règles compte : le chemin le plus précis doit être déclaré avant le générique."},{"h":"TLS","p":"Le certificat est stocké dans un Secret de type kubernetes.io/tls, référencé dans spec.tls. Le contrôleur fait la terminaison TLS : le trafic arrive en HTTPS et repart en HTTP vers le pod, sauf configuration contraire."},{"h":"Déboguer un 404 ou un 503","p":"404 : aucune règle ne correspond à l'hôte ou au chemin. 503 : la règle existe mais le service n'a pas d'endpoints prêts. Regardez les logs du contrôleur avant de suspecter l'application."}]},{"id":"m3_l3","t":"DNS interne et NetworkPolicy","steps":[{"h":"Le DNS du cluster","p":"CoreDNS résout les noms de services. Forme complète : mon-service.mon-namespace.svc.cluster.local. Dans le même namespace, le nom court suffit. Hors du namespace, il faut au minimum service.namespace."},{"h":"Résoudre pour vérifier","p":"kubectl run tmp --rm -it --image=busybox -- nslookup mon-service. Si le nom ne résout pas, vérifiez que CoreDNS tourne et que le service existe dans le bon namespace. Un nom résolu mais une connexion refusée, c'est autre chose : le port ou les endpoints."},{"h":"NetworkPolicy","p":"Par défaut, tout le monde parle à tout le monde. Une NetworkPolicy permet de restreindre par labels, ports et namespaces. Commencez par un deny total dans un namespace de test, puis ouvrez ce qui est nécessaire."},{"h":"La limite à connaître","p":"Une NetworkPolicy n'a d'effet que si le plugin réseau l'implémente. Calico, Cilium, Weave le font ; certains plugins minimalistes non. Une politique appliquée sans effet donne un faux sentiment de sécurité."}]}]},{"id":"m4","n":"Configuration et ressources","pct":"Module","e":"⚙️","lessons":[{"id":"m4_l1","t":"ConfigMap et Secret","steps":[{"h":"Séparer la configuration","p":"Une image doit être la même partout ; ce qui change, ce sont les paramètres. ConfigMap porte les valeurs non sensibles, Secret les valeurs sensibles. Les deux se montent en variables d'environnement ou en fichiers."},{"h":"Secret n'est pas un coffre-fort","p":"Par défaut, un Secret est simplement encodé en base64 dans etcd. Activez le chiffrement au repos, ou utilisez un gestionnaire externe (Vault, External Secrets). base64 n'est pas du chiffrement, tout le monde peut le décoder."},{"h":"Montage ou variables","p":"En variable d'environnement, la valeur est figée au démarrage du conteneur. En fichier monté, Kubernetes met à jour le contenu, mais l'application doit relire le fichier. Choisissez selon le comportement de votre application."},{"h":"Bonnes pratiques","p":"Un ConfigMap par application et par environnement, nommé avec sa version. Évitez de mettre toute la configuration dans un seul objet géant : une modification devient un redéploiement complet."}]},{"id":"m4_l2","t":"Les sondes","steps":[{"h":"Trois sondes, trois rôles","p":"Liveness : le conteneur est-il vivant ? Sinon, on le tue et on le relance. Readiness : peut-il recevoir du trafic ? Sinon, on le retire des endpoints. Startup : a-t-il fini de démarrer ? Sinon, on attend avant d'appliquer les autres."},{"h":"La conséquence concrète","p":"Sans readiness, un pod lent reçoit du trafic avant d'être prêt : erreurs 502 au déploiement. Avec une liveness trop agressive, un pod qui a un pic de charge est tué et relancé en boucle. Les deux erreurs sont symétriques."},{"h":"Les types de sonde","p":"httpGet sur un chemin, tcpSocket sur un port, exec d'une commande. Ajoutez initialDelaySeconds, periodSeconds, timeoutSeconds et failureThreshold. Les valeurs par défaut sont rarement adaptées à une application réelle."},{"h":"Déboguer une sonde","p":"kubectl describe pod montre les événements Unhealthy. Vérifiez le chemin, le port et le code retour attendu. Une sonde HTTP sur un service qui renvoie 401 ou 302 échoue, même si l'application fonctionne."}]},{"id":"m4_l3","t":"Requests, limits et QoS","steps":[{"h":"Requests et limits","p":"Requests : ce que le pod demande au scheduler pour être placé. Limits : le plafond qu'il ne peut pas dépasser. Sans requests, le scheduler place au hasard et tout le monde subit."},{"h":"Ce qui se passe au dépassement","p":"Limite mémoire dépassée : le conteneur est tué, OOMKilled. Limite CPU dépassée : il est ralenti (throttling), pas tué. Confondre les deux conduit à chercher un crash là où il y a une bride."},{"h":"Les classes QoS","p":"Guaranteed : requests égales aux limits partout. Burstable : requests inférieures aux limits. BestEffort : rien de déclaré. En cas de pression mémoire, Kubernetes évince d'abord les BestEffort, puis les Burstable. C'est l'argument décisif pour déclarer des requests."},{"h":"Encadrer par namespace","p":"ResourceQuota limite le total d'un namespace, LimitRange impose des valeurs par défaut et des bornes par conteneur. Sans les deux, une équipe peut consommer tout le cluster avec trois manifests mal écrits."}]}]},{"id":"m5","n":"Stockage","pct":"Module","e":"💾","lessons":[{"id":"m5_l1","t":"Volumes éphémères","steps":[{"h":"Pourquoi un volume dans un pod","p":"Deux conteneurs d'un même pod peuvent partager un répertoire. Sans volume, chacun a son système de fichiers, et tout disparaît avec le conteneur. C'est le rôle d'emptyDir."},{"h":"emptyDir","p":"Créé au démarrage du pod, détruit avec lui. Parfait pour un cache, des fichiers temporaires, un échange entre sidecars. À ne jamais utiliser pour des données à conserver, même quelques minutes."},{"h":"hostPath","p":"Monte un répertoire du nœud dans le pod. Pratique pour un agent de supervision, dangereux pour tout le reste : le pod dépend d'un nœud précis et peut écrire dans le système hôte. À éviter en production."},{"h":"Le réflexe","p":"Si la donnée doit survivre au pod, ce n'est pas un volume éphémère qu'il faut, c'est un PersistentVolumeClaim. Se poser la question avant d'écrire le YAML évite une perte de données."}]},{"id":"m5_l2","t":"PV, PVC et StorageClass","steps":[{"h":"Le modèle déclaratif","p":"Le PersistentVolume est la ressource de stockage réelle. Le PersistentVolumeClaim est la demande : taille, mode d'accès. Kubernetes apparie les deux. L'application ne référence que le PVC."},{"h":"Les modes d'accès","p":"ReadWriteOnce : un seul nœud en écriture. ReadOnlyMany : plusieurs nœuds en lecture. ReadWriteMany : plusieurs nœuds en écriture, rare et dépendant du backend. Un PVC en RWO ne peut pas être monté par deux pods sur deux nœuds différents."},{"h":"Provisionnement dynamique","p":"Une StorageClass décrit comment créer un volume à la demande. C'est le mode normal dans le cloud : vous créez un PVC, le volume apparaît. Sans StorageClass, il faut créer le PV à la main."},{"h":"reclaimPolicy","p":"Delete supprime le volume quand le PVC disparaît. Retain le conserve, à vous de le récupérer. En production, Retain par défaut sur les données précieuses : un kubectl delete malheureux ne doit pas effacer une base."}]},{"id":"m5_l3","t":"StatefulSet","steps":[{"h":"Ce que le Deployment ne sait pas faire","p":"Un Deployment donne des pods interchangeables, avec des noms aléatoires et des volumes séparés non stables. Une base de données a besoin de l'inverse : une identité stable et son propre volume, toujours le même."},{"h":"Identité et ordre","p":"Un StatefulSet nomme ses pods app-0, app-1, app-2, dans cet ordre, et les démarre séquentiellement. Chaque pod garde son nom et son volume à travers les redémarrages. C'est ce qui permet à un cluster de base de se reformer."},{"h":"Le service headless","p":"Un service sans ClusterIP (clusterIP: None) donne un enregistrement DNS par pod : app-0.app.default.svc.cluster.local. Sans lui, pas d'identité réseau stable, et donc pas de réplication maître-esclave possible."},{"h":"La question à se poser","p":"Un StatefulSet ne rend pas une base de données hautement disponible : il rend son identité stable. La réplication, le basculement, les sauvegardes restent à votre charge, ou à celle d'un opérateur dédié."}]}]},{"id":"m6","n":"Control plane et sécurité","pct":"Module","e":"🔐","lessons":[{"id":"m6_l1","t":"Les composants en détail","steps":[{"h":"etcd","p":"Stockage clé/valeur, port 2379, quorum nécessaire. Trois nœuds minimum pour tolérer une panne. Une sauvegarde etcd non testée est une sauvegarde qui n'existe pas."},{"h":"API server","p":"Trois étapes pour chaque requête : authentification (qui es-tu), autorisation (as-tu le droit), admission (le manifeste est-il acceptable). Comprendre cet ordre évite de chercher au mauvais endroit quand un déploiement est refusé."},{"h":"Scheduler","p":"Il filtre les nœuds (ressources, taints, affinités), puis note les candidats. Un pod Pending avec un événement FailedScheduling vous dit précisément pourquoi : mémoire insuffisante, taint non toléré, volume non attachable."},{"h":"Controller manager","p":"Une boucle par type d'objet : deployment, replicaset, node, endpoints, job. Chaque boucle compare l'état réel à l'état désiré et corrige. C'est la raison pour laquelle supprimer un pod d'un deployment ne change rien à long terme."}]},{"id":"m6_l2","t":"RBAC","steps":[{"h":"Quatre objets","p":"Role et ClusterRole définissent des permissions. RoleBinding et ClusterRoleBinding les accordent. Un Role vit dans un namespace, un ClusterRole est global. Le binding détermine la portée réelle."},{"h":"Ce qu'on écrit dedans","p":"Des règles : apiGroups, resources, verbs. Par exemple pods en get, list, watch. Le verbe delete est distinct : un rôle lecture ne permet pas de supprimer, heureusement."},{"h":"Vérifier sans se tromper","p":"kubectl auth can-i delete pods --as=system:serviceaccount:dev:builder -n dev répond oui ou non. C'est la seule façon fiable de vérifier, la lecture du YAML étant facile à mal interpréter."},{"h":"Les pièges","p":"Un RoleBinding référence un Role du même namespace ; pour un ClusterRole, il peut être dans n'importe quel namespace. Un compte de service sans binding est authentifié mais n'a aucun droit, ce qui produit des erreurs 403 déroutantes."}]},{"id":"m6_l3","t":"Sauvegarder et restaurer etcd","steps":[{"h":"Sauvegarder","p":"ETCDCTL_API=3 etcdctl snapshot save /backup/etcd.db avec les certificats CA, client et clé. Vérifiez ensuite avec snapshot status : un fichier de la bonne taille ne prouve rien."},{"h":"Restaurer","p":"etcdctl snapshot restore vers un nouveau data-dir, puis pointer le manifeste statique d'etcd vers ce répertoire, et redémarrer le pod statique. En cluster managé, cette manipulation est interdite : c'est le fournisseur qui sauvegarde."},{"h":"Le test qui compte","p":"Une restauration chronométrée, sur un cluster de test, au moins une fois par trimestre. Noter la durée réelle, pas la durée théorique. C'est ce chiffre qui détermine votre RTO."},{"h":"La règle","p":"Sauvegarde automatique, copie hors du cluster, chiffrement, et test régulier. Les quatre. Trois sur quatre ne suffisent pas le jour de l'incident."}]}]},{"id":"m7","n":"Cloud et production","pct":"Module","e":"☁️","lessons":[{"id":"m7_l1","t":"GKE et AKS","steps":[{"h":"Ce que le fournisseur gère","p":"Le control plane, ses mises à jour, son intégration IAM et réseau. Vous gérez les nœuds, les charges de travail, les politiques. Cette frontière explique la moitié des questions de coût."},{"h":"Créer un cluster GKE","p":"gcloud container clusters create demo --zone europe-west1-b --num-nodes 3. Puis gcloud container clusters get-credentials demo pour installer le contexte kubectl. Vérifiez toujours le contexte actif avant d'appliquer un manifeste."},{"h":"Node pools et autoscaling","p":"Un node pool regroupe des nœuds de même taille. Le cluster autoscaler ajoute ou retire des nœuds selon les pods Pending. Le HPA, lui, ajoute des pods. Les deux se complètent, ils ne se remplacent pas."},{"h":"Le coût","p":"Un control plane managé se paie, même sans charge. Les nœuds se paient à la seconde. Un cluster oublié pendant un week-end coûte plus cher que la formation. Surveillez, ou supprimez."}]},{"id":"m7_l2","t":"Mises à jour et retours arrière","steps":[{"h":"La stratégie","p":"RollingUpdate remplace les pods progressivement. maxSurge : combien de pods en plus pendant l'opération. maxUnavailable : combien peuvent manquer. Les deux valeurs pilotent la vitesse et le risque."},{"h":"Ce qui rend une mise à jour sans coupure","p":"Une readiness probe correcte, et un nombre de replicas suffisant. Sans readiness, Kubernetes considère le nouveau pod prêt dès qu'il est démarré, et envoie du trafic à une application qui n'écoute pas encore."},{"h":"Revenir en arrière","p":"kubectl rollout undo deployment/web revient à la révision précédente. rollout history liste les révisions. Pour revenir plus loin : --to-revision=2. L'historique est limité par revisionHistoryLimit."},{"h":"Protéger la disponibilité","p":"Un PodDisruptionBudget garantit qu'un nombre minimum de pods reste disponible pendant une opération volontaire (drain, mise à jour de nœud). Il ne protège pas d'une panne, seulement des interruptions planifiées."}]},{"id":"m7_l3","t":"Autoscaling","steps":[{"h":"Le HPA","p":"HorizontalPodAutoscaler ajuste le nombre de replicas selon une métrique, le plus souvent le CPU. Il lui faut metrics-server, sinon il affiche unknown et ne fait rien."},{"h":"La condition d'un HPA qui marche","p":"Chaque conteneur doit déclarer des requests CPU. Le HPA calcule un pourcentage de la request : sans request, il n'a pas de référence et reste aveugle. C'est l'erreur numéro un."},{"h":"VPA et cluster autoscaler","p":"Le VPA ajuste les requests d'un pod, ce qui nécessite souvent un redémarrage. Le cluster autoscaler ajoute des nœuds quand des pods restent Pending. Empiler les trois sans mesure produit des oscillations."},{"h":"Mesurer avant d'autoscaler","p":"Un HPA sur une application mal profilée ajoute des pods lents. Commencez par mesurer la latence et la consommation réelle, puis fixez des seuils qui correspondent à un comportement observé."}]}]},{"id":"m8","n":"Déboguer un cluster","pct":"Module","e":"🩺","lessons":[{"id":"m8_l1","t":"Les trois premiers réflexes","steps":[{"h":"Lire les événements","p":"kubectl get events --sort-by=.lastTimestamp -n mon-ns. La plupart des pannes sont décrites là, en clair : image introuvable, quota dépassé, volume non monté."},{"h":"Décrire l'objet","p":"kubectl describe pod mon-pod affiche l'état, les conditions, les derniers événements et les sondes en échec. C'est plus utile que les logs quand le conteneur ne démarre pas du tout."},{"h":"Lire les logs","p":"kubectl logs mon-pod, et --previous pour le conteneur précédent quand il a redémarré. Sans --previous, vous lisez les logs du nouveau conteneur, qui est peut-être déjà en train de mourir."},{"h":"Vérifier le contexte","p":"La moitié des 'ça ne marche pas' viennent d'un namespace ou d'un cluster différent. kubectl config view --minify affiche le contexte et le namespace actifs. Premier réflexe, avant toute analyse."}]},{"id":"m8_l2","t":"Les pannes classiques","steps":[{"h":"ImagePullBackOff","p":"Le nœud ne peut pas télécharger l'image : nom mal orthographié, tag inexistant, registre privé sans imagePullSecret. Vérifiez avec docker pull depuis le nœud, ou regardez l'événement Failed to pull image."},{"h":"CrashLoopBackOff","p":"Le conteneur démarre puis meurt en boucle. Logs --previous obligatoires. Trois causes fréquentes : commande invalide, variable d'environnement manquante, application qui quitte immédiatement faute de configuration."},{"h":"Pending","p":"Aucun nœud ne peut accueillir le pod. describe donne la raison : ressources insuffisantes, taint sans toleration, volume non disponible, affinité impossible. Ce n'est jamais un problème d'image."},{"h":"OOMKilled","p":"La limite mémoire est atteinte, le noyau tue le conteneur. Augmenter la limite est un pansement : cherchez la fuite ou le pic. La sortie 137 dans describe est la signature de ce cas."}]},{"id":"m8_l3","t":"Réseau et debug avancé","steps":[{"h":"Tester depuis l'intérieur","p":"kubectl run tmp --rm -it --image=nicolaka/netshoot -- bash, puis curl, dig, nc. Tester depuis votre poste ne prouve rien : le chemin réseau n'est pas le même."},{"h":"kubectl debug","p":"Un conteneur éphémère s'ajoute au pod sans le redémarrer : kubectl debug -it mon-pod --image=busybox. Indispensable sur une image distroless où aucun shell n'est disponible."},{"h":"Port-forward","p":"kubectl port-forward svc/mon-service 8080:80 ouvre un tunnel local. C'est un outil de diagnostic, pas une exposition : il traverse vos droits et s'arrête avec votre session."},{"h":"Quand ça résiste","p":"Si le DNS résout, que les endpoints existent et que la connexion échoue, regardez les NetworkPolicies, puis le plugin réseau, puis les règles iptables du nœud. Un tcpdump sur l'interface du pod tranche en trente secondes."}]}]}],"questions":{"m1":[{"q":"Quel composant stocke l'état complet du cluster ?","o":["kubelet","etcd","le scheduler","kube-proxy"],"a":1,"w":"etcd est la mémoire du cluster. Le perdre sans sauvegarde, c'est perdre le cluster."},{"q":"Que se passe-t-il si vous supprimez un pod géré par un Deployment ?","o":["Rien, il est recréé","Le Deployment passe en erreur","Le service s'arrête","Le nœud redémarre"],"a":0,"w":"Le ReplicaSet recrée un pod pour revenir au nombre désiré. C'est la réconciliation."},{"q":"Quel est le rôle du kubelet ?","o":["Router le trafic entre pods","Écrire dans etcd","Piloter les conteneurs sur son nœud","Signer les certificats"],"a":2,"w":"Le kubelet reçoit les PodSpec de l'API server et fait tourner les conteneurs via le runtime."},{"q":"Un pod nu avec restartPolicy Always survit-il à la perte du nœud ?","o":["Oui","Non","Seulement avec un PVC","Seulement en cloud"],"a":1,"w":"Le pod nu n'est pas réordonnancé ailleurs. Il faut un ReplicaSet ou un Deployment pour cela."},{"q":"Quelle commande bascule d'un cluster à l'autre ?","o":["kubectl switch","kubectl config use-context","kubectl cluster set","kubectl context"],"a":1,"w":"use-context change le contexte actif dans le kubeconfig."},{"q":"Minikube sert à quoi ?","o":["Cluster multi-nœuds de production","Cluster local d'apprentissage","Registre d'images","Supervision"],"a":1,"w":"Un nœud local, suffisant pour apprendre et pour la plupart des exercices."},{"q":"Quel objet garantit un nombre constant de pods identiques ?","o":["Deployment","ReplicaSet","StatefulSet","DaemonSet"],"a":1,"w":"Le ReplicaSet assure le compte. Le Deployment l'enveloppe pour gérer les versions."},{"q":"Que fait le controller-manager ?","o":["Il expose l'API","Il exécute les boucles de réconciliation","Il stocke l'état","Il route le réseau"],"a":1,"w":"Un contrôleur par type d'objet, chacun compare l'état réel à l'état désiré."}],"m2":[{"q":"Deux conteneurs dans le même pod partagent :","o":["Le système de fichiers","L'adresse IP et le réseau","Les limites CPU","Le nom d'hôte externe"],"a":1,"w":"Ils partagent le namespace réseau du pod, donc localhost, et peuvent partager des volumes."},{"q":"Où se déclare le nombre de replicas d'un Deployment ?","o":["spec.replicas","spec.template.replicas","metadata.replicas","status.replicas"],"a":0,"w":"status.replicas est l'observation, spec.replicas l'intention."},{"q":"Un Deployment ne crée aucun pod. Cause la plus probable ?","o":["Image absente","Sélecteur qui ne correspond pas aux labels","Pas de service","Pas de namespace"],"a":1,"w":"Le sélecteur doit correspondre exactement aux labels du template. Sinon rien n'est adopté, sans erreur."},{"q":"À quoi servent les annotations ?","o":["À sélectionner des objets","À stocker des métadonnées non sélectionnables","À remplacer les labels","À chiffrer les données"],"a":1,"w":"Elles portent de l'information pour les outils, jamais pour la sélection."},{"q":"Un namespace est-il une frontière de sécurité ?","o":["Oui","Non, c'est un cloisonnement logique","Oui, avec RBAC seulement","Seulement en cloud"],"a":1,"w":"La sécurité vient du RBAC et des NetworkPolicies. Par défaut, les pods de deux namespaces communiquent."},{"q":"Quelle commande montre pourquoi un pod ne démarre pas ?","o":["kubectl logs","kubectl describe pod","kubectl get pod","kubectl top pod"],"a":1,"w":"describe affiche les événements, donc la cause, même quand il n'y a pas de logs."},{"q":"Que fait kubectl rollout undo ?","o":["Supprime le deployment","Revient à la révision précédente","Redémarre le cluster","Annule un apply"],"a":1,"w":"Il restaure le PodTemplate de la révision précédente."},{"q":"Combien de conteneurs applicatifs dans un pod en pratique ?","o":["Un seul, le plus souvent","Toujours trois","Jamais plus de deux","Autant qu'on veut sans limite"],"a":0,"w":"Le pod est l'unité de placement : plusieurs conteneurs applicatifs dedans compliquent le scaling."}],"m3":[{"q":"Un Service ClusterIP est joignable :","o":["Depuis Internet","Depuis le cluster uniquement","Depuis le nœud seulement","Depuis un autre cluster"],"a":1,"w":"C'est le type par défaut, interne au cluster."},{"q":"Que signifie des endpoints vides pour un Service ?","o":["Le service est supprimé","Le sélecteur ne correspond à aucun pod prêt","Le port est fermé","Le DNS est cassé"],"a":1,"w":"Pas d'endpoints = pas de pod prêt correspondant au sélecteur."},{"q":"port et targetPort : lequel désigne le conteneur ?","o":["port","targetPort","nodePort","hostPort"],"a":1,"w":"port est celui du Service, targetPort celui du conteneur."},{"q":"Un Ingress fonctionne sans contrôleur ?","o":["Oui","Non","Seulement en cloud","Seulement avec TLS"],"a":1,"w":"L'objet est une configuration lue par un contrôleur qui fait le vrai travail de proxy."},{"q":"Quel type de Service donne un nom DNS par pod ?","o":["ClusterIP","NodePort","Headless (clusterIP: None)","LoadBalancer"],"a":2,"w":"Un service headless publie un enregistrement par pod, indispensable aux StatefulSets."},{"q":"Une NetworkPolicy sans plugin réseau compatible :","o":["Bloque tout","N'a aucun effet","Provoque une erreur","S'applique partiellement"],"a":1,"w":"La politique est stockée mais non appliquée : faux sentiment de sécurité."},{"q":"Forme DNS complète d'un service ?","o":["service.namespace.svc.cluster.local","namespace.service.local","service.cluster.local","svc.service.namespace"],"a":0,"w":"C'est l'ordre attendu par CoreDNS."},{"q":"Un 503 renvoyé par l'ingress signifie le plus souvent :","o":["Chemin inconnu","Service sans endpoints prêts","Certificat expiré","DNS cassé"],"a":1,"w":"404 = pas de règle, 503 = règle présente mais backend indisponible."}],"m4":[{"q":"Un Secret Kubernetes est par défaut :","o":["Chiffré en base","Encodé en base64","Haché","Stocké hors cluster"],"a":1,"w":"base64 est un encodage réversible, pas un chiffrement."},{"q":"Un ConfigMap monté en fichier est mis à jour :","o":["Jamais","Automatiquement dans le pod","Au redémarrage seulement","Uniquement en cloud"],"a":1,"w":"Le kubelet synchronise le volume ; l'application doit relire le fichier pour en profiter."},{"q":"Liveness probe échoue : que fait Kubernetes ?","o":["Retire le pod des endpoints","Tue et relance le conteneur","Met le pod en Pending","Augmente la mémoire"],"a":1,"w":"Échec de liveness = redémarrage. C'est readiness qui retire du trafic."},{"q":"Sans readiness probe, un déploiement :","o":["Est plus rapide","Peut envoyer du trafic à un pod non prêt","Ne démarre pas","Perd ses logs"],"a":1,"w":"Le pod est considéré prêt dès que le conteneur tourne."},{"q":"Limite mémoire dépassée :","o":["Throttling","OOMKilled","Pending","Éviction du nœud"],"a":1,"w":"Le noyau tue le processus. Le throttling concerne le CPU."},{"q":" "Google","Le kubelet","Le scheduler local"],"a":1,"w":"C'est la différence de fond avec un cluster auto-hébergé."},{"q":"maxUnavailable contrôle :","o":["Le nombre de pods en plus","Le nombre de pods manquants autorisés","La vitesse réseau","Le nombre de nœuds"],"a":1,"w":"maxSurge ajoute, maxUnavailable retire : les deux bornent la perturbation."},{"q":"Sans readiness, une mise à jour provoque :","o":["Rien","Des erreurs pendant le basculement","Un rollback automatique","Un redémarrage du nœud"],"a":1,"w":"Le trafic part vers des pods qui n'écoutent pas encore."},{"q":"Que fait un PodDisruptionBudget ?","o":["Bloque les pannes","Garantit un minimum de pods pendant une opération volontaire","Accélère le drain","Supprime les pods"],"a":1,"w":"Il protège des interruptions planifiées, pas des incidents."},{"q":"Le HPA a besoin de :","o":["Un Ingress","metrics-server et des requests","Un PVC","Un DaemonSet"],"a":1,"w":"Sans métriques ni requests, il affiche unknown et ne fait rien."},{"q":"Qui ajoute des nœuds quand des pods restent Pending ?","o":["HPA","VPA","Cluster autoscaler","kube-proxy"],"a":2,"w":"Le HPA ajoute des pods, le cluster autoscaler ajoute des nœuds."},{"q":"rollout undo sans --to-revision :","o":["Revient à la première version","Revient à la précédente","Supprime tout","Échoue"],"a":1,"w":"Il recule d'une révision."},{"q":"Un cluster managé oublié coûte :","o":["Rien","Le control plane et les nœuds","Seulement le stockage","Seulement le réseau"],"a":1,"w":"Le control plane est facturé même sans charge."}],"m8":[{"q":"Un conteneur redémarre en boucle : quels logs lire ?","o":["kubectl logs","kubectl logs --previous","kubectl describe node","kubectl top pod"],"a":1,"w":"--previous lit le conteneur qui vient de mourir."},{"q":"ImagePullBackOff signifie :","o":["Crash applicatif","Le nœud ne peut pas télécharger l'image","Mémoire insuffisante","Sonde en échec"],"a":1,"w":"Nom, tag, registre privé : l'événement le précise."},{"q":"Pending signifie :","o":["Le conteneur crash","Aucun nœud ne peut accueillir le pod","Le service est absent","Le DNS est cassé"],"a":1,"w":"describe affiche FailedScheduling et sa raison."},{"q":"Code de sortie 137 :","o":["Erreur applicative","OOMKilled ou SIGKILL","Arrêt propre","Timeout"],"a":1,"w":"128 + 9 : le processus a été tué."},{"q":"Quel outil ajoute un conteneur de debug à un pod existant ?","o":["kubectl exec","kubectl debug","kubectl attach","kubectl cp"],"a":1,"w":"Le conteneur éphémère s'ajoute sans redémarrer le pod."},{"q":"Tester un service depuis votre poste :","o":["Prouve que le réseau du cluster fonctionne","Ne prouve rien du chemin interne","Remplace un pod de test","Suffit toujours"],"a":1,"w":"Le chemin réseau n'est pas le même ; testez depuis un pod."},{"q":"Les NetworkPolicies sont appliquées par :","o":["kube-proxy","Le plugin réseau (CNI)","Le scheduler","CoreDNS"],"a":1,"w":"Sans implémentation côté CNI, la politique est stockée mais inerte."},{"q":"Premier réflexe devant un 'ça ne marche pas' :","o":["Redémarrer le cluster","Vérifier contexte et namespace","Supprimer le pod","Réinstaller kubectl"],"a":1,"w":"La moitié des cas viennent du mauvais contexte ou du mauvais namespace."}]},"cheatsheets":[{"id":"cheat1","t":"Objets et commandes","items":[{"t":"Lister","c":"kubectl get pods,deploy,svc,ing -A"},{"t":"Détail","c":"kubectl describe pod NAME -n NS"},{"t":"YAML","c":"kubectl get deploy NAME -o yaml"},{"t":"Appliquer","c":"kubectl apply -f file.yaml"},{"t":"Supprimer","c":"kubectl delete -f file.yaml"}]},{"id":"cheat2","t":"Déploiement","items":[{"t":"Créer","c":"kubectl create deployment web --image=nginx --replicas=3"},{"t":"Exposer","c":"kubectl expose deployment web --port=80 --type=ClusterIP"},{"t":"Changer l'image","c":"kubectl set image deployment/web nginx=nginx:1.27"},{"t":"Suivre","c":"kubectl rollout status deployment/web"},{"t":"Revenir","c":"kubectl rollout undo deployment/web"}]},{"id":"cheat3","t":"Diagnostic","items":[{"t":"Événements","c":"kubectl get events --sort-by=.lastTimestamp"},{"t":"Logs précédents","c":"kubectl logs POD --previous"},{"t":"Entrer","c":"kubectl exec -it POD -- sh"},{"t":"Debug","c":"kubectl debug -it POD --image=busybox"},{"t":"Tunnel","c":"kubectl port-forward svc/NAME 8080:80"}]},{"id":"cheat4","t":"Réseau","items":[{"t":"Endpoints","c":"kubectl get endpoints NAME"},{"t":"DNS","c":"kubectl run tmp --rm -it --image=busybox -- nslookup NAME"},{"t":"Policies","c":"kubectl get networkpolicy -A"},{"t":"Ingress","c":"kubectl get ingress -A"}]},{"id":"cheat5","t":"Stockage","items":[{"t":"PVC","c":"kubectl get pvc"},{"t":"PV","c":"kubectl get pv"},{"t":"Classes","c":"kubectl get storageclass"},{"t":"Monter","c":"volumes: [{name: d, persistentVolumeClaim: {claimName: c}}]"}]},{"id":"cheat6","t":"Sécurité","items":[{"t":"Tester un droit","c":"kubectl auth can-i delete pods --as=system:serviceaccount:dev:sa -n dev"},{"t":"Rôles","c":"kubectl get role,clusterrole -A"},{"t":"Bindings","c":"kubectl get rolebinding,clusterrolebinding -A"},{"t":"Secrets","c":"kubectl get secret NAME -o jsonpath='{.data}'"}]}],"tips":[{"t":"Vérifier le contexte","p":"kubectl config view --minify avant chaque commande sensible. Un apply dans le mauvais cluster ne se voit qu'après."},{"t":"describe avant logs","p":"Quand un conteneur ne démarre pas, il n'y a pas de logs. describe donne l'événement, donc la cause."},{"t":"Le sélecteur d'abord","p":"Un service sans endpoints, un deployment qui ne crée rien : dans les deux cas, vérifiez les labels avant tout le reste."},{"t":"Une seule modification à la fois","p":"Changez l'image, observez. Changez la sonde, observez. Deux modifications simultanées rendent la cause indétectable."}],"docs":[{"id":"doc_start","t":"Comment suivre cette formation","body":[{"h":"Le parcours","p":"Huit modules, du conteneur au diagnostic. Suivez-les dans l'ordre : chaque module réutilise les objets du précédent. Comptez 6 à 8 heures de lecture et autant de pratique."},{"h":"Le rythme conseillé","p":"Un module par jour, puis les labs du module le même jour. Lire sans taper ne fixe rien : la main retient ce que l'œil oublie."},{"h":"La validation","p":"Chaque module a son QCM. 80 pour cent de réussite est le seuil raisonnable avant de passer au suivant. En dessous, relisez les leçons du module."},{"h":"Le certificat","p":"Il se génère depuis l'écran d'accueil quand tous les modules sont lus et les QCM réussis. Il porte votre nom, la date et le détail des modules validés. Il atteste d'une formation suivie, pas d'une certification officielle Kubernetes."}]},{"id":"doc_prereq","t":"Prérequis et outillage","body":[{"h":"Ce qu'il faut savoir","p":"Docker (image, conteneur, volume, réseau) et Git. Des bases Linux : se déplacer, éditer un fichier, lire un log. Le reste est enseigné ici."},{"h":"Ce qu'il faut installer","p":"kubectl, minikube ou kind, et un éditeur. Rien d'autre : pas de compte cloud nécessaire pour les modules 1 à 6."},{"h":"La machine","p":"8 Go de RAM suffisent pour minikube avec 2 Go alloués. 4 cœurs rendent les labs plus confortables. Un disque avec 20 Go libres évite les mauvaises surprises."},{"h":"Le cloud","p":"Le module 7 utilise GKE ou AKS. Un compte d'essai suffit, mais pensez à supprimer le cluster après : le control plane est facturé même à l'arrêt des charges."}]},{"id":"doc_method","t":"Méthode de travail","body":[{"h":"Toujours par le YAML","p":"Les commandes impératives (kubectl run, create deployment) servent à apprendre et à dépanner. En production, tout passe par un manifeste versionné dans Git. C'est la seule façon de savoir ce qui tourne."},{"h":"Lire avant d'appliquer","p":"kubectl diff -f manifest.yaml montre ce qui va changer. Sur un cluster qui compte, c'est la différence entre une mise à jour et un incident."},{"h":"Nommer pour retrouver","p":"Un préfixe par équipe, un label app et un label version. Sans ces trois, le premier kubectl get pods -A devient illisible au bout de trois semaines."},{"h":"Détruire ce qu'on crée","p":"Chaque lab doit finir par un nettoyage. Un cluster d'apprentissage qui accumule les objets finit par saturer, et vous passerez une soirée à chercher pourquoi un pod reste Pending."}]},{"id":"doc_cert","t":"À propos du certificat","body":[{"h":"Ce qu'il atteste","p":"Avoir parcouru l'intégralité des huit modules et réussi les QCM. C'est une attestation de formation, délivrée localement par cette application."},{"h":"Ce qu'il n'est pas","p":"Ni le CKA, ni le CKAD, ni aucune certification officielle. Ces examens se passent chez la Linux Foundation, sur un cluster réel, et ne s'obtiennent pas en lisant."},{"h":"Comment l'obtenir","p":"Terminez tous les modules, puis ouvrez l'écran d'accueil : le bouton de certificat apparaît. Saisissez votre nom, imprimez ou enregistrez en PDF."},{"h":"La suite logique","p":"Après cette formation, un entraînement CKA sur cluster réel est la bonne étape. Le vocabulaire sera acquis, il restera la vitesse et les réflexes en conditions de temps limité."}]}],"labs":[{"id":"lab1","dom":"m1","t":"Premier cluster","brief":"Démarrez un cluster local, vérifiez le nœud, listez les pods système.","sol":"minikube start\nkubectl get nodes\nkubectl get pods -A","check":"Un nœud Ready et les pods système en Running."},{"id":"lab2","dom":"m2","t":"Déployer et exposer","brief":"Créez un Deployment nginx à 3 replicas, exposez-le en ClusterIP, vérifiez les endpoints.","sol":"kubectl create deployment web --image=nginx --replicas=3\nkubectl expose deployment web --port=80\nkubectl get endpoints web","check":"3 pods Running et 3 adresses dans les endpoints."},{"id":"lab3","dom":"m2","t":"Mise à jour et retour arrière","brief":"Changez l'image pour nginx:1.27, suivez le rollout, puis revenez à la version précédente.","sol":"kubectl set image deployment/web nginx=nginx:1.27\nkubectl rollout status deployment/web\nkubectl rollout history deployment/web\nkubectl rollout undo deployment/web","check":"Deux révisions visibles et retour à la première."},{"id":"lab4","dom":"m3","t":"Ingress local","brief":"Activez l'addon ingress sur minikube et exposez web sur web.local.","sol":"minikube addons enable ingress\nkubectl create ingress web --rule=\"web.local/*=web:80\"","check":"curl avec l'en-tête Host renvoie la page nginx."},{"id":"lab5","dom":"m4","t":"Configuration et sondes","brief":"Créez un ConfigMap, injectez-le en variable, ajoutez une readiness sur /, puis cassez le chemin pour observer.","sol":"kubectl create configmap app --from-literal=MODE=prod\n# monter en env puis readinessProbe httpGet path: /nope\nkubectl describe pod","check":"Le pod devient NotReady et sort des endpoints."},{"id":"lab6","dom":"m5","t":"Volume persistant","brief":"Créez un PVC de 1Gi, montez-le dans un pod, écrivez un fichier, supprimez le pod, recréez-le.","sol":"kubectl create -f pvc.yaml\nkubectl run writer --image=busybox --overrides=... -- sh -c 'echo ok > /data/f'\n# recréer et cat /data/f","check":"Le fichier est toujours là après recréation."},{"id":"lab7","dom":"m5","t":"StatefulSet","brief":"Déployez un StatefulSet à 3 replicas avec un service headless et vérifiez les noms DNS.","sol":"kubectl apply -f sts.yaml\nkubectl get pods -l app=db\nkubectl run tmp --rm -it --image=busybox -- nslookup db-0.db","check":"db-0, db-1, db-2 répondent chacun à leur nom."},{"id":"lab8","dom":"m6","t":"RBAC minimal","brief":"Créez un compte de service qui peut seulement lister les pods dans dev, et vérifiez.","sol":"kubectl create sa reader -n dev\nkubectl create role podreader --verb=list --resource=pods -n dev\nkubectl create rolebinding rb --role=podreader --serviceaccount=dev:reader -n dev\nkubectl auth can-i list pods --as=system:serviceaccount:dev:reader -n dev","check":"Oui pour list, non pour delete."},{"id":"lab9","dom":"m6","t":"Sauvegarde etcd","brief":"Prenez un snapshot etcd avec les certificats, puis vérifiez son intégrité.","sol":"ETCDCTL_API=3 etcdctl snapshot save /tmp/etcd.db \\\n --endpoints=https://127.0.0.1:2379 \\\n --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n --cert=/etc/kubernetes/pki/etcd/server.crt \\\n --key=/etc/kubernetes/pki/etcd/server.key\nETCDCTL_API=3 etcdctl snapshot status /tmp/etcd.db","check":"Le status affiche un hash et un nombre de clés cohérent."},{"id":"lab10","dom":"m8","t":"Diagnostic guidé","brief":"Provoquez un CrashLoopBackOff, puis un Pending, et trouvez la cause de chacun sans aide.","sol":"# image inexistante puis ressources énormes\nkubectl describe pod\nkubectl get events --sort-by=.lastTimestamp","check":"Vous nommez la cause exacte dans les deux cas, à partir des événements."}]};
const VERSION = "20261110.0614";
const KEY="cka_v1", TOKKEY="cka_tok";
const GOAL_XP=60, QPER=12;
const AVATARS=["🐧","🦊","🐼","🦉","🐙","🦁","🐸","🐨","🦄","🐺","🦖","🐳"];

const $=s=>document.querySelector(s);
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800)}
const today=()=>new Date().toISOString().slice(0,10);

function blank(){return{profile:null,xp:0,streak:0,best:0,last:null,minutes:0,good:0,bad:0,seen:{},history:{},created:Date.now(),gistId:null}}
let S=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY));return r&&r.seen?r:blank()}catch(e){return blank()}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function touchDay(){const t=today();if(S.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 S.streak=S.last===y?S.streak+1:1;S.best=Math.max(S.best||0,S.streak);S.last=t;save()}

function domainById(id){return DATA.domains.find(d=>d.id===id)}
function lessonById(id){for(const d of DATA.domains){const l=d.lessons.find(x=>x.id===id);if(l)return{l,d}}return null}
function domainPct(id){const d=domainById(id);if(!d)return 0;let s=0,n=0;
 d.lessons.forEach(l=>{n+=l.steps.length;l.steps.forEach((_,i)=>{if(S.seen[l.id+"_"+i])s++})});
 return n?Math.round(100*s/n):0}

/* audio */
let ACTX=null, ABUF={};
function actx(){try{if(!ACTX){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ACTX=new C()}
 if(ACTX.state==="suspended")ACTX.resume();return ACTX}catch(e){return null}}
function unlockAudio(){const c=actx();try{if(c){const o=c.createOscillator(),g=c.createGain();g.gain.value=.0001;
 o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.05)}}catch(e){}}
window.addEventListener("pointerdown",unlockAudio,{once:true});
function playClip(src,rate,onend){
 const c=actx(); if(!c)return Promise.resolve(false);
 return (async()=>{try{let b=ABUF[src];
   if(!b){const r=await fetch(src);const ab=await r.arrayBuffer();b=await c.decodeAudioData(ab);ABUF[src]=b}
   const s=c.createBufferSource();s.buffer=b;s.playbackRate.value=rate||1;
   const g=c.createGain();g.gain.value=1;s.connect(g);g.connect(c.destination);
   s.onended=()=>{if(onend)onend()};s.start();return true}catch(e){return false}})();
}

/* ---------- render ---------- */
function render(){
 const a=$("#app");
 if(!S.profile)return onboard(a);
 switch(S._s||"home"){
  case "domains":return domainsScreen(a);
  case "domain":return domainScreen(a);
  case "lesson":return lessonScreen(a);
  case "cours":return coursScreen(a);
  case "quiz":return quizScreen(a);
  case "labs":return labsScreen(a);
  case "lab":return labScreen(a);
  case "mock":return mockScreen(a);

/* ---------- timed mock exam ---------- */
let EX=null, EXT=null;
function startMock(){
  const plan=[["arch",5],["work",3],["net",4],["stor",2],["trbl",6]];
  let list=[];
  plan.forEach(([dom,n])=>{
    const pool=(DATA.questions[dom]||[]).slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    pool.slice(0,n).forEach(q=>list.push({...q,dom}));
  });
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  EX={list,i:0,ans:new Array(list.length).fill(-1),left:7200,start:Date.now(),done:false};
  if(EXT)clearInterval(EXT);
  EXT=setInterval(()=>{
    if(!EX)return;
    EX.left--;
    const el=document.getElementById("clock");
    if(el)el.textContent=fmtTime(EX.left);
    if(EX.left<=0){clearInterval(EXT);submitMock()}
  },1000);
  go("mock");
}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`}
function mockScreen(a){
  if(!EX)return go("home");
  const q=EX.list[EX.i];
  const answered=EX.ans.filter(x=>x>=0).length;
  a.innerHTML=`<div class="top"><button class="back" onclick="if(confirm('Abandon the mock exam?')){clearInterval(EXT);EX=null;go('home')}">‹</button>
   <h2>Mock exam</h2><span class="pill" id="clock">${fmtTime(EX.left)}</span></div>
  <div class="between" style="margin-bottom:8px"><span class="pill">Question ${EX.i+1} / ${EX.list.length}</span>
  <span class="tiny muted">${answered} answered</span></div>
  <div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(100*answered/EX.list.length)}%"></i></div>
  <div class="cardq"><div class="tiny muted">${esc(domainById(q.dom).n)}</div>
  <div style="font-size:18px;font-weight:750;margin-top:8px;line-height:1.4">${esc(q.q)}</div></div>
  <div id="o">${q.o.map((x,i)=>`<button class="choice ${EX.ans[EX.i]===i?"ok":""}" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(x)}</button>`).join("")}</div>
  <div class="spacer"></div>
  <div class="grid2"><button class="btn alt" id="prev" ${EX.i===0?"disabled":""}>◀︎ Previous</button>
  <button class="btn alt" id="next" ${EX.i===EX.list.length-1?"disabled":""}>Next ▶︎</button></div>
  <div style="height:10px"></div>
  <button class="btn" id="sub">Submit — ${answered}/${EX.list.length} answered</button>`;
  a.querySelectorAll("#o .choice").forEach(b=>b.onclick=()=>{EX.ans[EX.i]=+b.dataset.i;render()});
  $("#prev").onclick=()=>{if(EX.i>0){EX.i--;render()}};
  $("#next").onclick=()=>{if(EX.i<EX.list.length-1){EX.i++;render()}};
  $("#sub").onclick=()=>{if(confirm("Submit the exam? You cannot change answers after."))submitMock()};
}
function submitMock(){
  if(!EX||EX.done)return;
  EX.done=true;clearInterval(EXT);
  const ok=EX.list.filter((q,i)=>EX.ans[i]===q.a).length;
  const n=EX.list.length, score=Math.round(100*ok/n);
  const per={};
  EX.list.forEach((q,i)=>{per[q.dom]=per[q.dom]||{ok:0,n:0};per[q.dom].n++;if(EX.ans[i]===q.a)per[q.dom].ok++});
  EX.result={ok,n,score,per,used:7200-EX.left};
  S.history[today()]=S.history[today()]||{xp:0,m:0};
  S.history[today()].m=(S.history[today()].m||0)+Math.round((7200-EX.left)/60);
  S.minutes+=Math.round((7200-EX.left)/60);save();
  go("mockresult");
}

function exportCSV(){

 DATA.domains.forEach(d=>d.lessons.forEach(l=>{const st=lessonStatus(l);
   out+=`"${d.n}";"${l.t}";${st.seen};${st.total};${st.pct}\n`}));
 const b=new Blob([out],{type:"text/csv;charset=utf-8"});
 const u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download="suivi-formation-k8s.csv";a.click();URL.revokeObjectURL(u);
}
function pdfEscape(t){
 const map={"é":"\351","è":"\350","ê":"\352","à":"\340","â":"\342","ç":"\347","ô":"\364","î":"\356","ï":"\357","ù":"\371","û":"\373","É":"\311","È":"\310","À":"\300","Ç":"\307","«":"\253","»":"\273","’":"\222","—":"\227"};
 return t.replace(/[éèêàâçôîïùûÉÈÀÇ«»’—]/g,c=>map[c]||c).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
function certPDF(){
 const total=DATA.domains.reduce((s,d)=>s+d.lessons.reduce((t,l)=>t+l.steps.length,0),0);
 const seen=Object.keys(S.seen).length, pct=Math.round(100*seen/total);
 const acc=Math.round(100*S.good/((S.good+S.bad)||1));
 const name=((S.profile&&S.profile.name)||"").replace(/[^\w\s\-'.]/g,"").slice(0,40);
 const date=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
 const lines=[
  ["FORMATION KUBERNETES",28],["du conteneur au cluster - 8 modules",12],["",10],
  ["Attestation de formation",16],["",12],["Décernée à",12],[name||"-",24],["",12],
  [`Progression : ${pct}%   Précision QCM : ${acc}%`,13],
  [`Temps cumule : ${Math.floor(S.minutes/60)}h${String(Math.round(S.minutes%60)).padStart(2,"0")}`,13],
  ["",14],[date,12],["",10],["Attestation locale de formation, non équivalente au CKA.",9]
 ];
 let y=760, content="";
 lines.forEach(([t,sz])=>{ if(!t) {y-=sz;return}
   content+=`BT /F1 ${sz} Tf 60 ${y} Td (${pdfEscape(t)}) Tj ET\n`; y-=sz*1.6+8; });
 const objs=[];
 objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
 objs[2]="<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
 objs[3]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>";
 objs[4]=`<< /Length ${content.length} >>\nstream\n${content}endstream`;
 objs[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
 let pdf="%PDF-1.4\n",offs=[];
 for(let i=1;i<objs.length;i++){offs[i]=pdf.length;pdf+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
 const xref=pdf.length;
 pdf+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
 for(let i=1;i<objs.length;i++) pdf+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
 pdf+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
 const bytes=new Uint8Array(pdf.length);
 for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&255;
 const b=new Blob([bytes],{type:"application/pdf"});
 const u=URL.createObjectURL(b),a2=document.createElement("a");
 a2.href=u;a2.download="attestation-formation-k8s.pdf";a2.click();URL.revokeObjectURL(u);
}

async function syncNow(){
 const t=localStorage.getItem(TOKKEY); if(!t)return toast("Add a GitHub token");
 const base="https://api.github.com";
 const h={Authorization:"***"+t,Accept:"application/vnd.github+json","Content-Type":"application/json"};
 try{
  if(S.gistId){const r=await fetch(base+"/gists/"+S.gistId,{headers:h});
    if(r.ok){const g=await r.json();const f=g.files&&g.files["cka-progress.json"];
      if(f&&f.content){try{const remote=JSON.parse(f.content);
        S.xp=Math.max(S.xp,remote.xp||0);S.good=Math.max(S.good,remote.good||0);S.bad=Math.max(S.bad,remote.bad||0);
        S.seen=Object.assign({},remote.seen||{},S.seen);
        S.history=Object.assign({},remote.history||{},S.history);
      }catch(e){}}}}
  const payload=JSON.stringify({description:"Formation K8s progress (private)",public:false,
    files:{"cka-progress.json":{content:JSON.stringify(S)}}});
  const r2=S.gistId?await fetch(base+"/gists/"+S.gistId,{method:"PATCH",headers:h,body:payload})
                    :await fetch(base+"/gists",{method:"POST",headers:h,body:payload});
  if(!r2.ok)throw new Error("HTTP "+r2.status);
  const g2=await r2.json();S.gistId=g2.id;S.synced=Date.now();save();toast("Synced ✓");render();
 }catch(e){toast("Failed: "+e.message)}
}

setInterval(()=>{if(!S.profile)return;const t=today();
 S.history[t]=S.history[t]||{xp:0,m:0};S.history[t].m=(S.history[t].m||0)+1/6;S.minutes+=1/6;save()},10000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});
render();
</script>
